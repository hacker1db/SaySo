name: Build Mac app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install whisper-cpp
      - run: ./scripts/test.sh
      - run: ./scripts/build.sh
      - run: codesign --verify --strict --deep build/Sayso.app
      - run: build/Sayso.app/Contents/MacOS/Sayso --render-previews build/previews
      - uses: actions/upload-artifact@v4
        with:
          name: Sayso-previews
          path: build/previews
      - run: ditto -c -k --keepParent "build/Sayso.app" "build/Sayso.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Sayso-macOS
          path: build/Sayso.zip
